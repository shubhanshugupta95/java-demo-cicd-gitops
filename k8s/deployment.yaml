apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-demo
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-demo
  template:
    metadata:
      labels:
        app: java-demo
    spec:
      containers:
      - name: java-demo
        image: shubhanshugupta/java-demo-cicd:latest
        ports:
        - containerPort: 8080
